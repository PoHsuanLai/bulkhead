# cargo-deny licence gate. Run: cargo deny check licenses
#
# A dependency whose licence is not listed fails the check rather than being noticed later by
# someone reading Cargo.lock. Permissive licences only; strong copyleft (GPL, AGPL, EUPL) stays out.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
